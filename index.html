
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <title>Periodic Table Information Finder</title>

    <style>
        body {
            background: linear-gradient(135deg, #f8c8dc, #cdb4db);
            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 20px;
        }

        .card-header {
            background: #a66bbe !important;
            border-radius: 20px 20px 0 0 !important;
        }

        #result {
            min-height: 120px;
            font-size: 1.05rem;
            background: #fff0f6;
            border-left: 6px solid #c77dba;
        }

        .footer-text {
            font-size: 0.9rem;
            color: #806080;
        }

        .btn-success {
            background-color: #c77dba;
            border-color: #c77dba;
        }

        .btn-success:hover {
            background-color: #a66bbe;
            border-color: #a66bbe;
        }

        .text-primary {
            color: #a66bbe !important;
        }

        .alert-info {
            background-color: #fce4ec;
            border-color: #f3c4d8;
            color: #784b68;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card shadow-lg">

                <div class="card-header text-white text-center p-4">

                    <h2>
                        <i class="bi bi-flask-fill"></i>
                        Non-Metal Elements
                    </h2>

                    <p class="mb-0">
                        Periodic Table Information Finder
                    </p>

                </div>

                <div class="card-body p-4">

                    <div class="alert alert-info">
                        <strong>Instructions:</strong><br>
                        Enter the <b>symbol</b> of a non-metal element.
                        (Example: H, O, Cl, Ne, Xe).
                    </div>

                    <form>

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                <i class="bi bi-search"></i>
                                Element Symbol
                            </label>

                            <input
                                type="text"
                                id="element_name"
                                class="form-control form-control-lg"
                                placeholder="Enter the symbol here">

                        </div>

                        <div class="d-grid">

                            <input
                                type="button"
                                py-click="element_checker"
                                value="Check Details"
                                class="btn btn-success btn-lg">

                        </div>

                    </form>

                    <hr>

                    <h5 class="text-primary">
                        <i class="bi bi-card-list"></i>
                        Result
                    </h5>

                    <div id="result" class="rounded p-3 shadow-sm">
                    </div>

                </div>

                <div class="card-footer bg-light text-center footer-text">

                    <i class="bi bi-lightbulb-fill text-warning"></i>
                    Skills Test • 2nd Quarter • Periodic Table

                </div>

            </div>

        </div>

    </div>

</div>

<py-script src="main.py"></py-script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
